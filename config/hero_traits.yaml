# Свойства героев для симуляции драфта и оценки (спецификация docs/specs/draft-simulation.md).
# Заполнено вручную по знанию игры (патч 7.41), правьте смело. Ключ — id героя из constants/heroes.json.
# Шкала 0–2 (нет / есть / сильная сторона героя), отсутствующий ключ = 0:
#   push           — урон по башням, быстрый снос строений
#   roshan         — рано и безопасно бьёт Рошана
#   teamfight      — массовые ульты и контроль по площади
#   split          — сплит-пуш: давит отдельную линию и уходит
#   kite           — дальность, замедления, бой на расстоянии
#   catch          — сближение и ловля: прыжки, контроль по цели (ответ на кайт и сплит)
#   anti_illusion  — урон по площади и клив против иллюзий и призывов
#   burst          — быстрый урон по одной цели
#   illusions      — 1, если сила героя в иллюзиях, клонах или призывах
# late: −2…+2 — насколько герой сильнее в длинной игре (поправка к статистике по длительности матчей).
# awkward: каких ответов требует неудобный герой; если ни у кого из соперника их нет, герой «ломает» драфт.
#   Значения — имена свойств выше (anti_illusion, catch, burst).
