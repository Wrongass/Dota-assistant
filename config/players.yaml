# team: our | opp; position: 1..5 или пусто; note — свободный комментарий о роли и стиле.
# reserve: true — запасной: в состав по умолчанию не входит. Состав на игру меняется на сайте (страница команды или
# соперника → «Состав на игру» → Сохранить), хранится в state/lineups.json; «Вернуть по конфигу» — обратно к этому файлу.
# Для соперников обязателен team_name — имя команды из league.group или league.playin.
our_team:
  name: Team Visual
  organization: Долг
  team_id: 10255027

# Киберлига «Трудовые резервы», 6 сезон (осень). На OpenDota/Dotabuff это один общий турнир на все
# дивизионы, поэтому соперников по группе перечисляем явно. team_id — из матчей лиги на OpenDota.
league:
  id: 18845
  name: Киберлига «Трудовые резервы», 6 сезон (осень) — дивизион Ancient, группа B
  since: 2026-10-01
  # Группа закончилась 25.10: 2-е место (1 победа, 1 ничья, 1 поражение; карты 3–3), прямого выхода нет — плей-ин.
  stage: "Плей-ин (верхняя сетка): W1 — мы против BIM Инжиниринг, W2 — ИТОЗ против Дом.РФ, W5 — победители W1 и W2. Проигравший W1 уходит в нижнюю сетку (L1)."
  next_opponent: BIM-TIM     # следующая игра — первая на главной странице, соперник по умолчанию в драфте
  prepare: [comaTOZ, CyberDOM2]   # к кому готовимся дальше (W5): показываются на главной ниже
  # Карты, которых нет в OpenDota, но результат известен с сайта турнира: идут только в счёт группы.
  manual_maps:
    - date: 2026-10-17
      winner: SD Team
      loser: Team Polyus
      note: "BO2 закончился 1:1, вторая карта не попала в OpenDota (счёт с сайта турнира)"
  group:
    - name: SD Team
      organization: GGsel
      team_id: 9782601
    - name: UPPO TEAM
      organization: УППО
      team_id: 9564376
    - name: Team Polyus
      organization: НИИ Полюс им. М.Ф. Стельмаха
      team_id: 9419839
  # Соперники плей-ина из других групп. Добавлены только команды нашей ветки сетки (W1, W2): весь дивизион —
  # ~25 команд и ~1200 запросов к OpenDota, а нужны нам максимум 3–4 соперника.
  playin:
    - name: BIM-TIM
      organization: BIM Инжиниринг
      team_id: 10282748
    - name: comaTOZ
      organization: ИТОЗ
      team_id: 10281979
    - name: CyberDOM2
      organization: Дом.РФ
      team_id: 10095821

